<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - JosMarketFind</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="container">
        <h1>Forgot Your Password? ₦</h1>
        <p class="text-center">No worries! Enter your email address below and we'll send you a link to reset your password.</p>

        <form id="forgot-password-form">
            <div class="form-group">
                <label for="reset-email">Email Address</label>
                <input type="email" id="reset-email" required>
            </div>
            <button type="submit" id="send-reset-email-btn">Send Password Reset Email</button>
        </form>

        <div id="message-container" class="message-container" style="display: none;">
            <!-- Messages will be displayed here by JavaScript -->
        </div>

        <div class="form-link">
            <a href="login.html">Back to Login</a> | <a href="signup.html">Create an Account</a>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <!-- No Firestore/Storage needed for this specific page's core function -->
    
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script> 
    <script src="js/main.js"></script>
</body>
</html>
